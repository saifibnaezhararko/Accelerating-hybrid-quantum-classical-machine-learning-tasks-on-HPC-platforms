[tool.poetry]
name = "qnlp-hpc"
version = "0.1.0"
description = "Accelerating hybrid quantum-classical machine learning tasks on HPC platforms (topic-aware QNLP classifier)."
authors = ["Saif Ibna Ezhar Arko <temorarymail01@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/saifibnaezhararko/Accelerating-hybrid-quantum-classical-machine-learning-tasks-on-HPC-platforms"
repository = "https://github.com/saifibnaezhararko/Accelerating-hybrid-quantum-classical-machine-learning-tasks-on-HPC-platforms"
packages = [{ include = "qnlp_hpc", from = "src" }]

# ---------------------------------------------------------------------------
# Runtime dependencies (CPU baseline — see software stack in CLAUDE.md §7).
# GPU packages live in the optional [gpu] group so CI / Windows can resolve.
# ---------------------------------------------------------------------------
[tool.poetry.dependencies]
python = ">=3.11,<3.12"
numpy = "~1.26"                # 1.26.x — stable ecosystem
networkx = "^3.0"             # lambeq dependency
lambeq = "0.5.0"              # QNLP: sentence -> string diagram -> circuit
qiskit = "^2.0"              # current SDK
qiskit-aer = "^0.15"        # CPU simulator (GPU variant in [gpu] extra)
pytket = "*"                # TKet SDK (original prototype backend)
pandas = "2.2.3"
scikit-learn = "1.5.2"
matplotlib = "^3.9"         # benchmark plots (qnlp_hpc.mc1_spider.reporting)
pyyaml = "^6.0"             # experiment config files in configs/
# Required, not optional: qnlp_hpc.mc1_spider imports torch unconditionally
# (PytorchModel / PytorchTrainer). Heavy, but the package will not import without it.
torch = "^2.4"

# Optional GPU / HPC acceleration — install on the Linux HPC node with CUDA 12.4–12.6.
# Poetry:  poetry install --with gpu
[tool.poetry.group.gpu]
optional = true

[tool.poetry.group.gpu.dependencies]
# 0.15.1 is the newest qiskit-aer-gpu on PyPI (the CUDA 12 build). CLAUDE.md section 7
# asks for 0.17.x, which does not exist under this name: only qiskit-aer-gpu-cu11
# reached 0.17.2, and that is a CUDA 11 wheel. Requesting ^0.17 made Poetry fail
# to resolve, which broke `poetry install` in CI even though this group is optional
# (Poetry locks every group, optional or not).
qiskit-aer-gpu = "^0.15"    # GPU simulator (requires CUDA toolkit + NVIDIA driver 550+)
cuquantum-python = "*"      # NVIDIA cuQuantum bindings (24.11+)

# Circuit-based simulation backends (CPU). See qnlp_hpc.backends.
# Poetry:  poetry install --with quantum
[tool.poetry.group.quantum]
optional = true

[tool.poetry.group.quantum.dependencies]
pennylane = "^0.38"          # torch-differentiable quantum layer (lambeq PennyLaneModel)
pennylane-qiskit = "^0.38"   # PennyLane -> Qiskit Aer: the PyTorch<->Qiskit seam
pytket-qiskit = "*"          # TketModel -> Aer, the original prototype path

# Dataset acquisition — only needed when pulling new corpora.
# Poetry:  poetry install --with data
[tool.poetry.group.data]
optional = true

[tool.poetry.group.data.dependencies]
kaggle = "^1.6"             # Kaggle API client (scripts/prepare_data.py --kaggle)

# Development tooling — lint, format, type-check, test, hooks.
[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
ruff = "^0.6"
black = "^24.0"
mypy = "^1.11"
pre-commit = "^3.8"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Standalone reference script kept verbatim as contributed (Zijia, SpiderAnsatz
# baseline). It is not part of the package and is not linted or reformatted.
extend-exclude = ["tests/Zijia_spider_test.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]   # pyflakes, pycodestyle, isort, pyupgrade, bugbear

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "tests/Zijia_spider_test\\.py"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true   # quantum libs ship partial stubs
packages = ["qnlp_hpc"]


[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --cov=qnlp_hpc --cov-report=term-missing"
testpaths = ["tests"]
# Collect only `test_*.py`. Without this, pytest's default also matches
# `*_test.py`, which would pick up tests/Zijia_spider_test.py and execute a full
# 150-epoch training run (plus a blocking plt.show()) during collection.
python_files = ["test_*.py"]
# Trainer checkpoint dirs written by lambeq — nothing to collect in them.
norecursedirs = ["runs", "outputs", ".git", "*.egg-info"]
