# Contributor-side auto-fix. Ruff lints (with --fix), black is the single
# formatter — ruff-format is deliberately NOT enabled, the two disagree.
# Install once per clone:  poetry run pre-commit install

# Standalone reference script kept verbatim as contributed — never rewritten.
exclude: '^tests/(Zijia_spider_test\.py|runs/)'

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: []
        args: [--ignore-missing-imports]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=2000]
